<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#214b39"><title>Finanças Edson Mendes</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#284236;background:#faf9f5}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.top{background:#fffefa;border-bottom:1px solid #e8e8df;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font:23px Georgia,serif;color:#24503c}.avatar{border-radius:50%;background:#e5eee6;padding:12px;font-size:12px;font-weight:bold}.wrap{max-width:950px;margin:auto;padding:32px 20px 120px}.over{font-size:10px;letter-spacing:2px;color:#819083;font-weight:bold}h1,h2{font-family:Georgia,serif;font-weight:normal}h1{font-size:clamp(29px,6vw,44px);margin:12px 0}.muted{color:#8c988f;font-size:14px}.balance{background:#214b39;color:white;border-radius:15px;padding:28px;margin:27px 0 18px;display:grid;gap:14px}.balance strong{font:clamp(32px,7vw,48px) Georgia,serif}.balance small{opacity:.7}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:25px}.stat,.panel{background:white;border:1px solid #e9ebe5;border-radius:13px;padding:20px}.stat{display:grid;gap:12px}.stat span{font-size:12px;color:#86938a}.stat strong{font:clamp(18px,4vw,26px) Georgia,serif}.panel{margin:15px 0}.heading{display:flex;justify-content:space-between;align-items:center}.heading button{background:none;border:0;color:#24573f}.item{display:flex;align-items:center;gap:12px;border-top:1px solid #f0f0ed;padding:16px 0}.circle{background:#eaf2eb;border-radius:50%;padding:10px;color:#256044}.desc{flex:1;display:grid;gap:5px}.desc small{color:#8b988d}.amount{font-weight:bold;white-space:nowrap;font-size:13px}.in{color:#25804c}.out{color:#a14e4a}.primary{background:#285740;color:white;border:0;border-radius:9px;padding:13px 18px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffefa;border-top:1px solid #e7e9e3;display:flex;justify-content:center;padding:11px 0 max(14px,env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:#859389;display:grid;gap:6px;justify-items:center;width:min(20%,140px);font-size:11px}.nav button.active{color:#21533c;font-weight:bold}.nav b{font-size:21px;font-weight:normal}.search{width:100%;padding:13px;border:1px solid #dfe6df;border-radius:9px;margin:15px 0}.menuItem{display:flex;justify-content:space-between;padding:18px 4px;border-bottom:1px solid #eceee9;width:100%;background:none;border-left:0;border-right:0;border-top:0;color:#254d3c;text-align:left}.overlay{position:fixed;inset:0;background:#15291b9a;display:grid;place-items:center;padding:20px;z-index:5}.dialog{width:min(420px,100%);background:white;padding:25px;border-radius:14px;display:grid;gap:15px}.dialog label{display:grid;gap:7px;font-size:13px}.dialog input,.dialog select{padding:12px;border:1px solid #dce4dd;border-radius:8px}.actions{display:flex;justify-content:end;gap:10px}.actions button{padding:12px;border-radius:8px;border:1px solid #ddd}.notice{font-size:12px;color:#8b938a}.empty{padding:35px;text-align:center;color:#87958b}@media(max-width:420px){.brand{font-size:18px}.stat,.panel{padding:15px}}
</style></head><body><header class="top"><span class="brand">✦ Finanças Edson Mendes</span><span class="avatar">EM</span></header><main class="wrap" id="app"></main><nav class="nav" id="nav"></nav><div id="modal"></div><script>
const tabs=[['Painel','⌂'],['Lançamentos','⇄'],['Contas','▤'],['Cobranças','▣'],['Mais','☰']];
let tab='Painel',search='';
let records=[{id:1,name:'Salário (exemplo)',type:'Receita',amount:8500,date:'15/10/2026',status:'Recebido'},{id:2,name:'Aluguel (exemplo)',type:'Despesa',amount:1800,date:'12/10/2026',status:'Pago'},{id:3,name:'Mercado (exemplo)',type:'Despesa',amount:486.9,date:'10/10/2026',status:'Pago'},{id:4,name:'Serviços (exemplo)',type:'Receita',amount:1200,date:'09/10/2026',status:'Pendente'}];
const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function list(rows){return rows.length?rows.map(r=>'<div class="item"><span class="circle">'+(r.type==='Receita'?'↗':'↘')+'</span><span class="desc"><b>'+safe(r.name)+'</b><small>'+safe(r.date)+' · '+safe(r.status)+'</small></span><span class="amount '+(r.type==='Receita'?'in':'out')+'">'+(r.type==='Receita'?'+ ':'− ')+money(r.amount)+'</span></div>').join(''):'<div class="empty">Nenhum lançamento encontrado.</div>'}
function render(){const inc=records.filter(r=>r.type==='Receita').reduce((s,r)=>s+r.amount,0),out=records.filter(r=>r.type==='Despesa').reduce((s,r)=>s+r.amount,0);
document.getElementById('nav').innerHTML=tabs.map(([name,icon])=>'<button class="'+(tab===name?'active':'')+'" data-tab="'+name+'"><b>'+icon+'</b>'+name+'</button>').join('');
let body='<div class="over">GESTÃO FINANCEIRA · DEMONSTRAÇÃO</div><h1>'+(tab==='Painel'?'Seu dinheiro, sob controle.':safe(tab))+'</h1><p class="muted">'+(tab==='Painel'?'Uma visão clara e organizada das suas finanças.':'Acompanhe e organize suas informações financeiras.')+'</p>';
if(tab==='Painel'){body+='<div class="balance"><span>Saldo do período</span><strong>'+money(inc-out)+'</strong><small>Outubro de 2026 · Valores ilustrativos</small></div><div class="stats"><div class="stat"><span>↗ Receitas</span><strong>'+money(inc)+'</strong></div><div class="stat"><span>↘ Despesas</span><strong>'+money(out)+'</strong></div></div><section class="panel"><div class="heading"><h2>Últimos lançamentos</h2><button data-tab="Lançamentos">Ver todos →</button></div>'+list(records.slice(0,4))+'</section>'}
else if(tab==='Lançamentos'){body+='<div class="stats"><div class="stat"><span>Receitas</span><strong>'+money(inc)+'</strong></div><div class="stat"><span>Despesas</span><strong>'+money(out)+'</strong></div></div><input class="search" id="search" placeholder="Buscar lançamentos..." value="'+safe(search)+'"><section class="panel" id="results">'+list(records.filter(r=>r.name.toLowerCase().includes(search.toLowerCase())))+'</section>'}
else if(tab==='Contas'){body+='<div class="stats"><div class="stat"><span>A pagar (ilustrativo)</span><strong>'+money(out)+'</strong></div><div class="stat"><span>A receber (ilustrativo)</span><strong>'+money(inc)+'</strong></div></div><section class="panel"><h2>Contas a pagar e receber</h2><p class="muted">Cadastro e acompanhamento de vencimentos: em desenvolvimento.</p></section>'}
else if(tab==='Cobranças'){body+='<section class="panel"><h2>Minhas cobranças</h2><p class="empty">Ainda não existem cobranças cadastradas nesta versão.</p></section>'}
else if(tab==='Mais'){body+='<section class="panel">'+['Clientes','Metas','Orçamentos','Cartões','Liberações','Configurações'].map(x=>'<button class="menuItem" data-tab="'+x+'">'+x+' <span>›</span></button>').join('')+'</section>'}
else{body+='<section class="panel"><h2>'+safe(tab)+'</h2><p class="muted">Módulo em desenvolvimento. Nenhum dado real foi importado.</p><button class="primary" data-tab="Mais">Voltar ao menu</button></section>'}
if(['Painel','Lançamentos'].includes(tab))body+='<button class="primary" id="new">＋ Novo lançamento</button>';
document.getElementById('app').innerHTML=body;
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;search='';render()}));
document.getElementById('new')?.addEventListener('click',showModal);
document.getElementById('search')?.addEventListener('input',e=>{search=e.target.value;document.getElementById('results').innerHTML=list(records.filter(r=>r.name.toLowerCase().includes(search.toLowerCase())))});
}
function showModal(){document.getElementById('modal').innerHTML='<div class="overlay"><form class="dialog" id="entry"><h2>Novo lançamento</h2><label>Descrição<input name="name" required maxlength="100" placeholder="Ex.: Conta de luz"></label><label>Valor (R$)<input name="amount" required type="number" min="0.01" step="0.01" placeholder="0,00"></label><label>Tipo<select name="type"><option>Despesa</option><option>Receita</option></select></label><div class="actions"><button type="button" id="cancel">Cancelar</button><button class="primary">Salvar</button></div><small class="notice">Demonstração: lançamentos não são salvos permanentemente.</small></form></div>';document.getElementById('cancel').onclick=()=>document.getElementById('modal').innerHTML='';document.getElementById('entry').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),amount=Number(f.get('amount'));if(!Number.isFinite(amount)||amount<=0)return;records.unshift({id:Date.now(),name:String(f.get('name')).trim(),amount,type:String(f.get('type')),date:new Date().toLocaleDateString('pt-BR'),status:'Pendente'});document.getElementById('modal').innerHTML='';tab='Lançamentos';render()}}
render();
</script></body></html>
