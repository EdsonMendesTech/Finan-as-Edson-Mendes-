<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#214b39"><title>Finanças Edson Mendes</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#284236;background:#faf9f5}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.top{background:#fffefa;border-bottom:1px solid #e8e8df;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font:23px Georgia,serif;color:#24503c}.avatar{border-radius:50%;background:#e5eee6;padding:12px;font-size:12px;font-weight:bold}.wrap{max-width:950px;margin:auto;padding:32px 20px 120px}.over{font-size:10px;letter-spacing:2px;color:#819083;font-weight:bold}h1,h2{font-family:Georgia,serif;font-weight:normal}h1{font-size:clamp(29px,6vw,44px);margin:12px 0}.muted{color:#8c988f;font-size:14px}.balance{background:#214b39;color:white;border-radius:15px;padding:28px;margin:27px 0 18px;display:grid;gap:14px}.balance strong{font:clamp(32px,7vw,48px) Georgia,serif}.balance small{opacity:.7}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:25px}.stat,.panel{background:white;border:1px solid #e9ebe5;border-radius:13px;padding:20px}.stat{display:grid;gap:12px}.stat span{font-size:12px;color:#86938a}.stat strong{font:clamp(18px,4vw,26px) Georgia,serif}.panel{margin:15px 0}.heading{display:flex;justify-content:space-between;align-items:center}.heading button{background:none;border:0;color:#24573f}.item{display:flex;align-items:center;gap:12px;border-top:1px solid #f0f0ed;padding:16px 0}.circle{background:#eaf2eb;border-radius:50%;padding:10px;color:#256044}.desc{flex:1;display:grid;gap:5px}.desc small{color:#8b988d}.amount{font-weight:bold;white-space:nowrap;font-size:13px}.in{color:#25804c}.out{color:#a14e4a}.primary{background:#285740;color:white;border:0;border-radius:9px;padding:13px 18px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffefa;border-top:1px solid #e7e9e3;display:flex;justify-content:center;padding:11px 0 max(14px,env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:#859389;display:grid;gap:6px;justify-items:center;width:min(20%,140px);font-size:11px}.nav button.active{color:#21533c;font-weight:bold}.nav b{font-size:21px;font-weight:normal}.search{width:100%;padding:13px;border:1px solid #dfe6df;border-radius:9px;margin:15px 0}.menuItem{display:flex;justify-content:space-between;padding:18px 4px;border-bottom:1px solid #eceee9;width:100%;background:none;border-left:0;border-right:0;border-top:0;color:#254d3c;text-align:left}.overlay{position:fixed;inset:0;background:#15291b9a;display:grid;place-items:center;padding:20px;z-index:5}.dialog{width:min(420px,100%);background:white;padding:25px;border-radius:14px;display:grid;gap:15px}.dialog label{display:grid;gap:7px;font-size:13px}.dialog input,.dialog select{padding:12px;border:1px solid #dce4dd;border-radius:8px}.actions{display:flex;justify-content:end;gap:10px}.actions button{padding:12px;border-radius:8px;border:1px solid #ddd}.notice{font-size:12px;color:#8b938a}.empty{padding:35px;text-align:center;color:#87958b}@media(max-width:420px){.brand{font-size:18px}.stat,.panel{padding:15px}}
 .statusbtn{display:inline-block;background:#eaf2eb;color:#24573f;border:1px solid #d2e2d6;border-radius:6px;padding:6px 8px;text-align:left;font-size:11px;width:max-content;max-width:100%} </style></head><body><header class="top"><span class="brand">✦ Finanças Edson Mendes</span><span class="avatar">EM</span></header><main class="wrap" id="app"></main><nav class="nav" id="nav"></nav><div id="modal"></div><script>
const tabs=[['Painel','⌂'],['Lançamentos','⇄'],['Contas','▤'],['Cobranças','▣'],['Mais','☰']];
let tab='Painel',search='';
const STORAGE_KEY='mendestech_demo_financas_v1';
let records=[];
try{const stored=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(Array.isArray(stored))records=stored.filter(r=>r&&typeof r.name==='string'&&['Receita','Despesa'].includes(r.type)&&Number.isFinite(r.amount)&&r.amount>0).slice(0,1000)}catch(e){records=[]}
function saveRecords(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(records))}catch(e){alert('Não foi possível salvar neste navegador.')}}
const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function statusOf(r){return ['A pagar','Pago','A receber','Recebido'].includes(r.status)?r.status:(r.type==='Receita'?'A receber':'A pagar')}
function list(rows){return rows.length?rows.map(r=>'<div class="item"><span class="circle">'+(r.type==='Receita'?'↗':'↘')+'</span><span class="desc"><b>'+safe(r.name)+'</b><small>'+safe(r.date)+' · '+safe(statusOf(r))+'</small><button class="statusbtn" data-id="'+r.id+'">'+(statusOf(r)==='A pagar'?'Marcar como pago':statusOf(r)==='A receber'?'Marcar como recebido':'Alterar situação')+'</button></span><span class="amount '+(r.type==='Receita'?'in':'out')+'">'+(r.type==='Receita'?'+ ':'− ')+money(r.amount)+'</span></div>').join(''):'<div class="empty">Nenhum lançamento encontrado.</div>'}
function summary(){return {paid:records.filter(r=>statusOf(r)==='Pago').reduce((s,r)=>s+r.amount,0),received:records.filter(r=>statusOf(r)==='Recebido').reduce((s,r)=>s+r.amount,0),payable:records.filter(r=>statusOf(r)==='A pagar').reduce((s,r)=>s+r.amount,0),receivable:records.filter(r=>statusOf(r)==='A receber').reduce((s,r)=>s+r.amount,0)}}
function render(){const s=summary();
document.getElementById('nav').innerHTML=tabs.map(([name,icon])=>'<button class="'+(tab===name?'active':'')+'" data-tab="'+name+'"><b>'+icon+'</b>'+name+'</button>').join('');
let body='<div class="over">GESTÃO FINANCEIRA · DEMONSTRAÇÃO LOCAL</div><h1>'+(tab==='Painel'?'Seu dinheiro, sob controle.':safe(tab))+'</h1><p class="muted">'+(tab==='Painel'?'Saiba o que já entrou, o que saiu e o que ainda está pendente.':'Acompanhe e organize suas informações financeiras.')+'</p>';
const cards='<div class="stats"><div class="stat"><span>✓ Recebido</span><strong>'+money(s.received)+'</strong></div><div class="stat"><span>✓ Pago</span><strong>'+money(s.paid)+'</strong></div><div class="stat"><span>◷ A receber</span><strong>'+money(s.receivable)+'</strong></div><div class="stat"><span>◷ Saldo devedor (a pagar)</span><strong>'+money(s.payable)+'</strong></div></div>';
if(tab==='Painel'){body+='<div class="balance"><span>Saldo movimentado (recebido − pago)</span><strong>'+money(s.received-s.paid)+'</strong><small>Saldo devedor mostrado abaixo · Não representa saldo bancário</small></div>'+cards+'<section class="panel"><div class="heading"><h2>Últimos lançamentos</h2><button data-tab="Lançamentos">Ver todos →</button></div>'+list(records.slice(0,4))+'</section>'}
else if(tab==='Lançamentos'){body+=cards+'<input class="search" id="search" placeholder="Buscar lançamentos..." value="'+safe(search)+'"><section class="panel" id="results">'+list(records.filter(r=>r.name.toLowerCase().includes(search.toLowerCase())))+'</section>'}
else if(tab==='Contas'){body+=cards+'<section class="panel"><h2>Contas a pagar e receber</h2>'+list(records.filter(r=>['A pagar','A receber'].includes(statusOf(r))))+'</section>'}
else if(tab==='Cobranças'){body+='<section class="panel"><h2>Valores a receber</h2>'+list(records.filter(r=>r.type==='Receita'))+'</section>'}
else if(tab==='Mais'){body+='<section class="panel">'+['Central de Planilhas','Planos Premium','Clientes','Metas','Orçamentos','Cartões','Liberações','Configurações'].map(x=>'<button class="menuItem" data-tab="'+x+'">'+x+' <span>›</span></button>').join('')+'</section>'}
else{body+='<section class="panel"><h2>'+safe(tab)+'</h2><p class="muted">Módulo em desenvolvimento. Nenhum dado real foi importado.</p><button class="primary" data-tab="Mais">Voltar ao menu</button></section>'}
if(['Painel','Lançamentos','Contas','Cobranças'].includes(tab))body+='<button class="primary" id="new">＋ Novo lançamento</button><p class="notice">Demonstração local: dados salvos somente neste navegador. Não use informações reais de clientes.</p>';
document.getElementById('app').innerHTML=body;
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.tab==='Central de Planilhas'){location.href='catalogo.html';return}if(b.dataset.tab==='Planos Premium'){location.href='premium.html';return}tab=b.dataset.tab;search='';render()}));
document.getElementById('new')?.addEventListener('click',showModal);
document.getElementById('search')?.addEventListener('input',e=>{search=e.target.value;document.getElementById('results').innerHTML=list(records.filter(r=>r.name.toLowerCase().includes(search.toLowerCase())));bindStatus()});
bindStatus();
}
function bindStatus(){document.querySelectorAll('.statusbtn').forEach(b=>b.addEventListener('click',()=>{const r=records.find(x=>String(x.id)===b.dataset.id);if(!r)return;const current=statusOf(r);r.status=current==='A pagar'?'Pago':current==='Pago'?'A pagar':current==='A receber'?'Recebido':'A receber';saveRecords();render()}))}
function showModal(){document.getElementById('modal').innerHTML='<div class="overlay"><form class="dialog" id="entry"><h2>Novo lançamento</h2><label>Descrição<input name="name" required maxlength="100" placeholder="Ex.: Conta de luz"></label><label>Valor (R$)<input name="amount" required type="number" min="0.01" step="0.01" placeholder="0,00"></label><label>Situação<select name="status" required><option value="A pagar">A pagar</option><option value="Pago">Pago</option><option value="A receber">A receber</option><option value="Recebido">Recebido</option></select></label><div class="actions"><button type="button" id="cancel">Cancelar</button><button class="primary">Salvar</button></div><small class="notice">Dados salvos apenas neste navegador, sem backup na nuvem.</small></form></div>';document.getElementById('cancel').onclick=()=>document.getElementById('modal').innerHTML='';document.getElementById('entry').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),amount=Number(f.get('amount')),status=String(f.get('status')),name=String(f.get('name')).trim();if(!Number.isFinite(amount)||amount<=0||!name||!['A pagar','Pago','A receber','Recebido'].includes(status))return;records.unshift({id:Date.now(),name,amount,type:['A receber','Recebido'].includes(status)?'Receita':'Despesa',date:new Date().toLocaleDateString('pt-BR'),status});saveRecords();document.getElementById('modal').innerHTML='';tab='Lançamentos';render()}}

render();
</script></body></html>
