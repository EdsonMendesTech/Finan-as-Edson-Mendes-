<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha | MendesTech Premium</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#0a3760,#03101e 68%);color:#eaf6ff;font:16px system-ui;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);padding:28px;background:#0a2137;border:1px solid #285c80;border-radius:20px;box-shadow:0 25px 70px #0008}h1{font-size:29px}p{color:#aec7dc;line-height:1.5}label{display:block;margin:15px 0 7px}input{width:100%;padding:14px;background:#061726;color:white;border:1px solid #3a6b90;border-radius:9px;font-size:16px}button{width:100%;background:#0788ee;border:0;color:white;font-weight:700;border-radius:9px;padding:15px;margin-top:20px;font-size:15px;cursor:pointer}button:disabled{opacity:.6}a{color:#62c1ff}.brand{font-weight:800;color:#4bb7ff}#msg{min-height:25px}</style></head><body><main class="card"><div class="brand">▣ MendesTech Premium</div><section id="request"><h1>Esqueci minha senha</h1><p>Informe seu e-mail cadastrado para receber o link de recuperação.</p><form id="requestForm"><label for="email">E-mail cadastrado</label><input id="email" type="email" autocomplete="email" required><button id="send">Enviar link de recuperação</button></form></section><section id="reset" hidden><h1>Definir nova senha</h1><p>Crie uma senha com pelo menos 8 caracteres, incluindo letras e números.</p><form id="resetForm"><label for="password">Nova senha</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Confirmar nova senha</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button id="change">Salvar nova senha</button></form></section><p id="msg" role="status"></p><p><a href="login.html">← Voltar ao login</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>const $=id=>document.getElementById(id);const sb=window.supabase?.createClient('https://cghuyppnayzvnocbcuxm.supabase.co','sb_publishable_EyUsqz17MOgERWB7WikVng_W_Cm0TFc');if(!sb)$('msg').textContent='Não foi possível carregar a conexão. Atualize a página.';let recovery=false;function showReset(){recovery=true;$('request').hidden=true;$('reset').hidden=false;$('msg').textContent=''}if(location.hash.includes('type=recovery'))showReset();if(sb){sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showReset()});$('requestForm').onsubmit=async e=>{e.preventDefault();$('send').disabled=true;$('msg').textContent='Enviando...';try{const {error}=await sb.auth.resetPasswordForEmail($('email').value.trim(),{redirectTo:new URL('recuperar-senha.html',location.href).href});if(error)throw error;$('msg').textContent='Se este e-mail estiver cadastrado, você receberá um link para redefinir sua senha. Confira também o spam.'}catch(err){$('msg').textContent='Não foi possível enviar o link: '+err.message}finally{$('send').disabled=false}};$('resetForm').onsubmit=async e=>{e.preventDefault();if(!recovery){$('msg').textContent='Abra o link de recuperação recebido por e-mail.';return}const p=$('password').value;if(p!==$('confirm').value){$('msg').textContent='As senhas não são iguais.';return}if(!/[A-Za-z]/.test(p)||!/[0-9]/.test(p)){$('msg').textContent='Use letras e números na senha.';return}$('change').disabled=true;try{const {error}=await sb.auth.updateUser({password:p});if(error)throw error;await sb.auth.signOut();$('msg').textContent='Senha alterada com sucesso. Volte ao login e entre com a nova senha.';$('reset').hidden=true}catch(err){$('msg').textContent='Não foi possível atualizar a senha: '+err.message}finally{$('change').disabled=false}}}</script></body></html>
