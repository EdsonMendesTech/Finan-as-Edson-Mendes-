<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · MendesTech Premium</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#071626;color:#e8f4ff;font:16px Arial,sans-serif;display:grid;place-items:center;padding:20px}.card{background:#10283f;border:1px solid #24577d;border-radius:18px;padding:28px;width:min(430px,100%)}h1{margin:8px 0 12px}.brand{color:#42b7ff;font-weight:bold}label{display:block;margin:18px 0 8px}input{width:100%;padding:13px;border:1px solid #5682a0;border-radius:9px;background:#071626;color:white}button{width:100%;padding:14px;background:#087bdc;color:white;border:0;border-radius:9px;margin-top:22px;font-weight:bold}p{line-height:1.5;color:#bad0e2}a{color:#75c9ff}</style></head><body><main class="card"><div class="brand">⬡ MendesTech Premium</div><h1>Acesso ao sistema</h1><p>Área para clientes e administrador.</p><form id="login"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Entrar</button></form><p id="message" role="status">Login ainda em configuração. Nenhuma senha será enviada ou armazenada nesta demonstração.</p><p><a href="catalogo.html">Conhecer as planilhas</a></p></main><script>document.getElementById('login').addEventListener('submit',e=>{e.preventDefault();document.getElementById('message').textContent='A autenticação segura ainda não foi conectada. Aguarde a liberação do acesso.';document.getElementById('password').value=''})</script></body></html>
