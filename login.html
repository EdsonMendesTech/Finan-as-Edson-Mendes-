<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro e login | MendesTech Premium</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#0a3760,#03101e 68%);color:#eaf6ff;font:16px system-ui;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);padding:28px;background:#0a2137;border:1px solid #285c80;border-radius:20px;box-shadow:0 25px 70px #0008}h1{font-size:29px}p{color:#aec7dc;line-height:1.5}label{display:block;margin:15px 0 7px}input{width:100%;padding:14px;background:#061726;color:white;border:1px solid #3a6b90;border-radius:9px;font-size:16px}button{width:100%;background:#0788ee;border:0;color:white;font-weight:700;border-radius:9px;padding:15px;margin-top:20px;font-size:15px;cursor:pointer}button:disabled{opacity:.6}a,.link{color:#62c1ff}.link{border:0;background:none;padding:5px;font-weight:600;margin-top:15px}.brand{font-weight:800;color:#4bb7ff}.badge{display:inline-block;background:#103e6a;padding:7px 10px;border-radius:9px;color:#bde7ff}#msg{min-height:25px}</style></head><body><main class="card"><div class="brand">▣ MendesTech Premium</div><h1 id="title">Criar sua conta</h1><span class="badge">🎁 7 dias grátis</span><p id="subtitle">Cada cliente tem seu acesso e seus dados separados.</p><form id="form"><div id="namewrap"><label for="name">Nome completo</label><input id="name" autocomplete="name" minlength="2" maxlength="90" required></div><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required><label for="password">Senha (mínimo de 8 caracteres)</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><button id="submit">Criar conta e começar grátis</button></form><p id="msg" role="status"></p><button type="button" class="link" id="toggle">Já tenho conta · Fazer login</button><p><a href="premium.html">← Voltar à página inicial</a></p></main><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';const sb=createClient('https://cghuyppnayzvnocbcuxm.supabase.co','sb_publishable_EyUsqz17MOgERWB7WikVng_W_Cm0TFc');let signup=true;const $=id=>document.getElementById(id);$('toggle').onclick=()=>{signup=!signup;$('title').textContent=signup?'Criar sua conta':'Entrar na sua conta';$('namewrap').hidden=!signup;$('name').required=signup;$('submit').textContent=signup?'Criar conta e começar grátis':'Entrar';$('toggle').textContent=signup?'Já tenho conta · Fazer login':'Ainda não tenho conta · Criar cadastro';$('msg').textContent='';$('password').autocomplete=signup?'new-password':'current-password'};$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('msg').textContent='Aguarde...';const email=$('email').value.trim(),password=$('password').value;try{const {data,error}=signup?await sb.auth.signUp({email,password,options:{data:{full_name:$('name').value.trim()},emailRedirectTo:new URL('app.html',location.href).href}}):await sb.auth.signInWithPassword({email,password});if(error)throw error;if(data.session){location.href='app.html'}else $('msg').textContent='Cadastro recebido. Verifique seu e-mail para confirmar a conta antes de entrar.'}catch(err){$('msg').textContent='Não foi possível concluir: '+(err.message||'tente novamente')}finally{$('submit').disabled=false;$('password').value=''}};sb.auth.getSession().then(({data})=>{if(data.session)location.href='app.html'})</script></body></html>
